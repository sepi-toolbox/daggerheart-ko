name: Release Module

# GitHub 릴리스를 publish 하면(태그 vX.Y.Z):
#  1) module.json version/manifest/download 를 해당 릴리스로 패치
#  2) module.json + module.zip 을 릴리스 에셋으로 업로드
#  3) (선택) Foundry 패키지 레지스트리에 새 버전 자동 등록
#     → 저장소 Secret FVTT_RELEASE_TOKEN 설정 시에만 동작

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch module.json (version + release URLs)
        env:
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          VERSION="${TAG#v}"
          VERSION="$VERSION" REPO="$REPO" TAG="$TAG" node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("module.json", "utf8"));
            m.version = process.env.VERSION;
            m.manifest = `https://github.com/${process.env.REPO}/releases/download/${process.env.TAG}/module.json`;
            m.download = `https://github.com/${process.env.REPO}/releases/download/${process.env.TAG}/module.zip`;
            fs.writeFileSync("module.json", JSON.stringify(m, null, 4) + "\n");
          '

      - name: Create module.zip
        run: zip -r module.zip . -x ".git/*" ".github/*" "HANDOFF.md"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            module.json
            module.zip

      - name: Publish version to Foundry registry
        if: ${{ github.event.release.prerelease == false }}
        env:
          FVTT_TOKEN: ${{ secrets.FVTT_RELEASE_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$FVTT_TOKEN" ]; then
            echo "FVTT_RELEASE_TOKEN 미설정 — Foundry 레지스트리 등록 건너뜀 (GitHub 릴리스만 갱신됨)."
            exit 0
          fi
          ID=$(jq -r '.id' module.json)
          VERSION=$(jq -r '.version' module.json)
          MIN=$(jq -r '.compatibility.minimum // ""' module.json)
          VER=$(jq -r '.compatibility.verified // ""' module.json)
          MAX=$(jq -r '.compatibility.maximum // ""' module.json)
          PAYLOAD=$(jq -n \
            --arg id "$ID" --arg ver "$VERSION" \
            --arg man "https://github.com/${REPO}/releases/download/${TAG}/module.json" \
            --arg notes "https://github.com/${REPO}/releases/tag/${TAG}" \
            --arg min "$MIN" --arg verified "$VER" --arg max "$MAX" \
            '{id:$id,"dry-run":false,release:{version:$ver,manifest:$man,notes:$notes,compatibility:{minimum:$min,verified:$verified,maximum:$max}}}')
          echo "Foundry 등록 요청: $ID v$VERSION"
          HTTP=$(curl -sS -w "%{http_code}" -o /tmp/resp.json -X POST \
            "https://foundryvtt.com/_api/packages/release_version/" \
            -H "Content-Type: application/json" \
            -H "Authorization: ${FVTT_TOKEN}" \
            --data "$PAYLOAD")
          echo "HTTP $HTTP"; cat /tmp/resp.json || true
          if [ "$HTTP" -ge 200 ] && [ "$HTTP" -lt 300 ]; then
            echo "✓ Foundry 레지스트리 등록 성공"
          else
            echo "✗ Foundry 등록 실패 (HTTP $HTTP) — 토큰/형식 확인 필요"
            exit 1
          fi
